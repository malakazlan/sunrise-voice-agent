# Alembic configuration. The database URL is not set here: env.py takes it from the
# app's settings (POSTGRES_* environment variables or .env). Log output is configured by
# env.py too (app/guard/logging.py), at LOG_LEVEL.
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
