[project]
name = "sunrise-voice-agent"
version = "0.1.0"
description = "Sunrise voice agent service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "tzdata==2026.6",
    "pipecat-ai[deepgram,webrtc]==1.17.0",
    "jellyfish==1.3.0",
    "anthropic==2.7.0",
    "presidio-analyzer==2.2.366",
    "presidio-anonymizer==2.2.366",
    "en-core-web-sm==3.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.2",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
# Some Pipecat methods the app calls (get_answer, disconnect) carry no annotations, nor does
# Presidio's AnonymizerEngine constructor.
untyped_calls_exclude = ["pipecat", "presidio_anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]
