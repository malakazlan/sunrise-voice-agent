name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job has a timeout a few minutes above its normal run, so a hang fails quickly.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run mypy --strict app tests scripts

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunrise
          POSTGRES_USER: sunrise
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sunrise -d sunrise"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sunrise
      POSTGRES_USER: sunrise
      POSTGRES_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Without safe.directory, git refuses the mounted checkout (different owner). When git
      # cannot read the repo, gitleaks reports "0 commits scanned" and exits 0, so the step
      # also requires a non-zero commit count.
      # By default gitleaks runs `git log -p -U0 --full-history --all --diff-filter=tuxdb`, so it
      # would scan every fetched branch. --log-opts replaces everything after -U0: the same
      # options with HEAD scan only the commit under test and its ancestors (on pull_request
      # the merge ref, on push main).
      - name: Scan the history of the checked-out commit
        run: |
          set -o pipefail
          . .github/ci-wait.sh
          bounded_run 300 "the gitleaks scan" ci-gitleaks --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-banner --no-color \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          scanned=$(sed -n 's/.* \([0-9][0-9]*\) commits scanned\..*/\1/p' "$RUNNER_TEMP/gitleaks.log")
          echo "commits scanned: ${scanned:-none}"
          test "${scanned:-0}" -gt 0

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant decoy env files that must not reach the image
        run: |
          printf 'DECOY=1\n' > app/.env
          printf 'DECOY=1\n' > app/.env.local
      - run: timeout 900 docker build -t sunrise-voice-agent:ci .
      - name: No .env file in the image
        run: |
          . .github/ci-wait.sh
          found=$(bounded_run 60 "the image file listing" ci-find-env --rm --entrypoint find \
            sunrise-voice-agent:ci /app -name '.env*')
          if [ -n "$found" ]; then
            echo ".env files found in the image:"
            echo "$found"
            exit 1
          fi
          echo "no .env files under /app"
      - name: Compose refuses to start without the database variables
        run: |
          code=0
          output=$(timeout 60 docker compose -f deploy/docker-compose.yml config 2>&1) || code=$?
          echo "$output" | tail -n 3
          echo "exit code: $code"
          test "$code" != "0"
          test "$code" != "124"
          # Compose versions differ: some stop at the first missing variable, others list all.
          pattern="required variable (POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|APP_ENV) is missing a value"
          echo "$output" | grep -Eq "$pattern"
      - name: Write the Compose env file
        run: |
          printf '%s\n' APP_ENV=prod POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432 \
            POSTGRES_DB=sunrise POSTGRES_USER=sunrise \
            POSTGRES_PASSWORD=ci-compose-only-password-0001 \
            APP_DB_USER=sunrise_app APP_DB_PASSWORD=ci-compose-only-app-password-0001 \
            TURN_HOST=127.0.0.1 TURN_SHARED_SECRET=ci-compose-only-turn-secret-00000001 \
            DEMO_ACCESS_TOKEN=ci-compose-only-access-token-000000001 MAX_CONCURRENT_CALLS=3 \
            AUDIT_HMAC_KEY=ci-compose-only-audit-key-000000000001 UNRELATED_DECOY=1 > .env
      - name: Smoke test through Compose
        run: |
          . .github/ci-wait.sh
          # `timeout` runs programs, not shell functions, so each bounded call spells it out.
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          bounded 900 "the stack to build and start" $compose up -d --build
          wait_for_status 120 http://127.0.0.1:8000/health 200 "the app to answer /health"
          docs=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)
          echo "GET /docs -> $docs"
          test "$docs" = "404"
          uid=$(bounded 30 "id -u in the app container" $compose exec -T app id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
          app=$($compose ps -q app)
          health=none
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$app")
            [ "$health" = "healthy" ] && break
            sleep 1
          done
          echo "HEALTHCHECK -> $health"
          if [ "$health" != "healthy" ]; then
            echo "gave up after 30s waiting for the app's HEALTHCHECK to report healthy"
            exit 1
          fi
          patients=$(bounded 30 "the patient count from the db" $compose exec -T db \
            psql -U sunrise -d sunrise -tAc 'SELECT count(*) FROM patients')
          echo "patients: $patients"
          test "$patients" = "5"
      - name: The app connects as the runtime role the start-up set up
        run: |
          set -o pipefail
          . .github/ci-wait.sh
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          # The app's own engine, built from its own settings inside its container, over the
          # network with the password (scram-sha-256 in the image's pg_hba.conf).
          user=$(bounded 60 "the app's database user" $compose exec -T app python -c '
          import asyncio
          from sqlalchemy import text
          from app.config import Settings
          from app.db.session import create_database_engine
          async def main():
              engine = create_database_engine(Settings())
              async with engine.connect() as connection:
                  print(await connection.scalar(text("SELECT current_user")))
              await engine.dispose()
          asyncio.run(main())
          ')
          echo "the app connects as: $user"
          test "$user" = "sunrise_app"
          # superuser, create roles, create databases, log in, replication, bypass row security
          attributes=$(bounded 30 "the runtime role's attributes" $compose exec -T db \
            psql -U sunrise -d sunrise -tAc "SELECT rolsuper, rolcreaterole, rolcreatedb,
              rolcanlogin, rolreplication, rolbypassrls FROM pg_roles WHERE rolname = 'sunrise_app'")
          echo "runtime role attributes: $attributes"
          test "$attributes" = "f|f|f|t|f|f"
          # As the role (over the db container's local socket): the audit log refuses a change
          # by privilege, before its triggers.
          code=0
          refused=$(bounded 30 "a DELETE as the runtime role" $compose exec -T db \
            psql -U sunrise_app -d sunrise -tAc 'DELETE FROM audit_events' 2>&1) || code=$?
          echo "DELETE as the runtime role -> exit $code: $refused"
          test "$code" = "1"
          echo "$refused" | grep -q 'permission denied for table audit_events'
      - name: The application process holds the runtime identity and not the owner's
        run: |
          set -o pipefail
          . .github/ci-wait.sh
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          # Inside the app container, as its non-root user, which uvicorn (PID 1) runs as too:
          # the names in PID 1's environment, never the values. Then every value in it is tried
          # as the owner's password and must be refused, while the owner's real password, from
          # the container's configuration that this exec sees, must work: the attempt is real.
          bounded 120 "the application process check" $compose exec -T app python -c '
          import os
          import subprocess
          import psycopg
          from app.config import Settings, StartupSettings
          def variables(settings_class):
              return {name.upper() for name in settings_class.model_fields}
          with open("/proc/1/cmdline", "rb") as file:
              command = [part.decode() for part in file.read().split(b"\0") if part]
          assert any(part.endswith("/uvicorn") for part in command), "PID 1 is not uvicorn"
          print("PID 1 runs uvicorn")
          with open("/proc/1/environ", "rb") as file:
              entries = [entry.decode() for entry in file.read().split(b"\0") if entry]
          process = dict(entry.split("=", 1) for entry in entries)
          names = set(process)
          known = variables(Settings) | variables(StartupSettings)
          print("application process variables:", " ".join(sorted(names & known)))
          # The read is real: what the process must have is there.
          assert {"PATH", "APP_DB_USER", "APP_DB_PASSWORD", "POSTGRES_HOST"} <= names
          assert names & known == variables(Settings), sorted((names & known) ^ variables(Settings))
          assert not names & {"POSTGRES_USER", "POSTGRES_PASSWORD"}
          owner = os.environ["POSTGRES_USER"]
          def owner_login(password):
              try:
                  psycopg.connect(
                      host=process["POSTGRES_HOST"], port=process["POSTGRES_PORT"],
                      dbname=process["POSTGRES_DB"], user=owner, password=password,
                      connect_timeout=10,
                  ).close()
              except psycopg.OperationalError as error:
                  refused = ("password authentication failed", "no password supplied")
                  assert any(reason in str(error) for reason in refused), "not a login refusal"
                  return False
              return True
          assert owner_login(os.environ["POSTGRES_PASSWORD"]), "the owner login itself fails"
          accepted = sum(owner_login(value) for value in process.values())
          print(f"owner logins with each of the {len(process)} values the process holds: {accepted}")
          assert accepted == 0
          # Nor can a start-up step run from what the application process holds.
          setup = subprocess.run(
              ["python", "-m", "app.db.roles"], env=process, capture_output=True, text=True,
              timeout=60,
          )
          assert setup.returncode != 0
          assert "postgres_user" in setup.stderr and "postgres_password" in setup.stderr
          print("role set-up with the application process environment: refused, no owner")
          '
      - name: A restart runs the set-up again and changes no role or privilege
        run: |
          . .github/ci-wait.sh
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          snapshot() {
            bounded 30 "the role and privilege snapshot" $compose exec -T db \
              psql -U sunrise -d sunrise -tA \
              -c "SELECT rolname, rolsuper, rolcreaterole, rolcreatedb, rolcanlogin,
                rolreplication, rolbypassrls FROM pg_roles WHERE rolname = 'sunrise_app'" \
              -c "SELECT relname, relacl FROM pg_class
                WHERE relnamespace = 'public'::regnamespace ORDER BY relname" \
              -c "SELECT nspname, nspacl FROM pg_namespace WHERE nspname = 'public'" \
              -c "SELECT datacl FROM pg_database WHERE datname = 'sunrise'"
          }
          app=$($compose ps -q app)
          started=$(docker inspect --format '{{.State.StartedAt}}' "$app")
          snapshot > "$RUNNER_TEMP/privileges-before"
          cat "$RUNNER_TEMP/privileges-before"
          # The snapshot holds the role and its grants, so the comparison below means something.
          grep -qx 'sunrise_app|f|f|f|t|f|f' "$RUNNER_TEMP/privileges-before"
          grep -q '^audit_events|.*sunrise_app=ar/sunrise' "$RUNNER_TEMP/privileges-before"
          bounded 120 "the app to restart" $compose restart app
          wait_for_status 120 http://127.0.0.1:8000/health 200 "the app to answer /health again"
          restarted=$(docker inspect --format '{{.State.StartedAt}}' "$app")
          echo "started $started, restarted $restarted"
          test "$restarted" != "$started"
          snapshot > "$RUNNER_TEMP/privileges-after"
          diff "$RUNNER_TEMP/privileges-before" "$RUNNER_TEMP/privileges-after"
          # The set-up ran on both starts: it created the role once and found it the second time.
          bounded 60 "the app's logs" $compose logs --no-color app > "$RUNNER_TEMP/app-logs"
          grep runtime_role_ready "$RUNNER_TEMP/app-logs"
          test "$(grep -c 'runtime_role_ready created=True' "$RUNNER_TEMP/app-logs")" = 1
          test "$(grep -c 'runtime_role_ready created=False' "$RUNNER_TEMP/app-logs")" = 1
      - name: The db container holds only the database variables
        run: |
          db=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q db)
          image=$(docker inspect --format '{{.Config.Image}}' "$db")
          # Allowed: what the Postgres image sets itself, plus the three credentials.
          {
            docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image"
            printf '%s\n' POSTGRES_DB= POSTGRES_USER= POSTGRES_PASSWORD=
          } | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/allowed-env"
          # Names only; values are never printed.
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$db" \
            | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/db-env"
          echo "db environment names: $(tr '\n' ' ' < "$RUNNER_TEMP/db-env")"
          unexpected=$(comm -23 "$RUNNER_TEMP/db-env" "$RUNNER_TEMP/allowed-env")
          if [ -n "$unexpected" ]; then
            echo "unexpected variables in the db container: $unexpected"
            exit 1
          fi
          for name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            grep -qx "$name" "$RUNNER_TEMP/db-env"
          done
          echo "db environment holds only the database variables"
      - name: The app container receives exactly the settings variables
        run: |
          set -o pipefail
          . .github/ci-wait.sh
          # Compose's resolved configuration, read by the app's own settings classes inside the
          # image. Names only; values are never printed. The container receives the variables
          # of both classes: the start-up steps need the owner. The application process gets
          # only its own class's (the step above checks the running process).
          timeout 60 docker compose --env-file .env -f deploy/docker-compose.yml config --format json \
            | bounded_run 60 "the settings-field comparison" ci-app-env -i --rm \
              --entrypoint python sunrise-voice-agent:ci -c '
          import json, sys
          from app.config import Settings, StartupSettings
          received = set(json.load(sys.stdin)["services"]["app"]["environment"])
          application = {name.upper() for name in Settings.model_fields}
          startup = {name.upper() for name in StartupSettings.model_fields}
          fields = application | startup
          print("app environment names:", " ".join(sorted(received)))
          print("of which only the start-up steps get:", " ".join(sorted(startup - application)))
          if received != fields or startup - application != {"POSTGRES_USER", "POSTGRES_PASSWORD"}:
              print("missing:", sorted(fields - received), "unexpected:", sorted(received - fields))
              sys.exit(1)
          '
      - name: The coturn container holds only its own variables
        run: |
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          image=$(docker inspect --format '{{.Config.Image}}' "$coturn")
          {
            docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image"
            printf '%s\n' TURN_HOST= TURN_SHARED_SECRET= MAX_CONCURRENT_CALLS=
          } | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/allowed-coturn-env"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$coturn" \
            | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/coturn-env"
          echo "coturn environment names: $(tr '\n' ' ' < "$RUNNER_TEMP/coturn-env")"
          unexpected=$(comm -23 "$RUNNER_TEMP/coturn-env" "$RUNNER_TEMP/allowed-coturn-env")
          if [ -n "$unexpected" ]; then
            echo "unexpected variables in the coturn container: $unexpected"
            exit 1
          fi
      - name: coturn runs from one config file, with quotas and deny rules, secret off its arguments
        run: |
          . .github/ci-wait.sh
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          state=$(docker inspect --format '{{.State.Status}} restarts={{.RestartCount}}' "$coturn")
          echo "coturn: $state"
          test "$state" = "running restarts=0"
          # The running process's arguments: one config file and nothing else, so neither a
          # second config source nor the secret.
          bounded 30 "coturn's command line" docker exec "$coturn" cat /proc/1/cmdline \
            > "$RUNNER_TEMP/coturn-cmdline"
          args=$(tr '\0' ' ' < "$RUNNER_TEMP/coturn-cmdline")
          echo "coturn command line: $args"
          test "$args" = "turnserver -c /tmp/turnserver.conf "
          secret=$(sed -n 's/^TURN_SHARED_SECRET=//p' .env)
          test -n "$secret"
          if tr '\0' '\n' < "$RUNNER_TEMP/coturn-cmdline" | grep -qF "$secret"; then
            echo "the shared secret is in coturn's arguments"
            exit 1
          fi
          # The settings coturn started from, without the secret line, which is there once.
          secret_lines=$(bounded 30 "coturn's config file" docker exec "$coturn" \
            grep -c '^static-auth-secret=' /tmp/turnserver.conf)
          test "$secret_lines" = 1
          bounded 30 "coturn's config file" docker exec "$coturn" \
            grep -v -e '^static-auth-secret=' -e '^#' /tmp/turnserver.conf \
            > "$RUNNER_TEMP/coturn-settings"
          cat "$RUNNER_TEMP/coturn-settings"
          for line in realm=127.0.0.1 user-quota=4 total-quota=27 max-bps=64000 \
            bps-capacity=1728000 max-allocate-lifetime=120 use-auth-secret no-tls \
            no-tcp-relay no-multicast-peers min-port=49160 max-port=49359 log-file=/dev/null \
            denied-peer-ip=0.0.0.0-0.255.255.255 denied-peer-ip=10.0.0.0-10.255.255.255 \
            denied-peer-ip=100.64.0.0-100.127.255.255 denied-peer-ip=127.0.0.0-127.255.255.255 \
            denied-peer-ip=169.254.0.0-169.254.255.255 denied-peer-ip=172.16.0.0-172.31.255.255 \
            denied-peer-ip=192.168.0.0-192.168.255.255 denied-peer-ip=::1 \
            denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
            denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff; do
            grep -qxF "$line" "$RUNNER_TEMP/coturn-settings" || { echo "missing: $line"; exit 1; }
          done
          echo "coturn settings checked"
      - name: coturn's entrypoint accepts and refuses the same values as the app
        run: |
          . .github/ci-wait.sh
          # A stub turnserver shows what the entrypoint would start coturn with; the app side
          # of the same table (deploy/coturn/validation-cases.json) is a pytest test. The
          # checker bounds each container run itself; this bounds the whole table.
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          image=$(docker inspect --format '{{.Config.Image}}' "$coturn")
          bounded 600 "the entrypoint check of all cases" \
            python3 scripts/check_coturn_entrypoint.py --image "$image"
      - name: Forced-relay echo through coturn, and the per-credential relay quota
        run: |
          . .github/ci-wait.sh
          # Only networking differs from the stack above: app and coturn join a network whose
          # addresses coturn does not deny, so no peer is allowed and every deny rule applies.
          echo "--- override used only by this step"
          cat deploy/docker-compose.relay-test.yml
          export TURN_HOST=203.0.113.10
          # `timeout` runs programs, not shell functions, so the command is spelled out.
          relay="docker compose --env-file .env -f deploy/docker-compose.yml"
          relay="$relay -f deploy/docker-compose.relay-test.yml"
          bounded 900 "the relay-test stack to build and start" $relay up -d --build
          wait_for_status 120 http://127.0.0.1:8000/health 200 "the app to answer /health"
          coturn=$($relay ps -q coturn)
          bounded 30 "coturn's config file" docker exec "$coturn" \
            grep -v -e '^static-auth-secret=' -e '^#' /tmp/turnserver.conf \
            > "$RUNNER_TEMP/relay-settings"
          echo "--- coturn settings here against the committed run (only the realm may differ)"
          diff "$RUNNER_TEMP/coturn-settings" "$RUNNER_TEMP/relay-settings" || true
          diff <(grep -v '^realm=' "$RUNNER_TEMP/coturn-settings") \
            <(grep -v '^realm=' "$RUNNER_TEMP/relay-settings")
          token=$(sed -n 's/^DEMO_ACCESS_TOKEN=//p' .env)
          # The probe bounds each of its own steps; this bounds each probe run as a whole.
          probe() {
            name=$1
            shift
            bounded_run 300 "the $name probe" "ci-probe-$name" --rm \
              --network sunrise-voice-agent_relay-test -e PROBE_TOKEN="$token" \
              -v "$PWD/scripts:/probe:ro" --entrypoint python sunrise-voice-agent:ci \
              -I /probe/echo_probe.py --url http://app:8000 "$@"
          }
          echo "--- three calls, relay candidates only"
          probe relay --calls 3 --relay
          echo "--- one credential tries twelve relays; another caller still gets one"
          probe quota --hoard 12 --expect-hoarded 4 --calls 1 --relay
      - name: Postgres logs no ERROR or WARNING lines, details or failing statements
        run: |
          . .github/ci-wait.sh
          show() {
            bounded 30 "SHOW $1 from the db" \
              docker compose --env-file .env -f deploy/docker-compose.yml exec -T db \
              psql -U sunrise -d sunrise -tAc "SHOW $1"
          }
          messages=$(show log_min_messages)
          verbosity=$(show log_error_verbosity)
          statements=$(show log_min_error_statement)
          echo "log_min_messages=$messages log_error_verbosity=$verbosity" \
            "log_min_error_statement=$statements"
          test "$messages" = "log"
          test "$verbosity" = "terse"
          test "$statements" = "panic"
      - name: Container without APP_ENV must not start
        run: |
          . .github/ci-wait.sh
          code=0
          output=$(bounded_run 60 "the app container to refuse to start" ci-no-app-env --rm \
            sunrise-voice-agent:ci 2>&1) || code=$?
          echo "$output" | tail -n 5
          echo "exit code: $code"
          test "$code" = "1"
          echo "$output" | grep -q "app_env"
      - name: Container without database, audit or voice settings must not start
        run: |
          . .github/ci-wait.sh
          code=0
          output=$(bounded_run 60 "the app container to refuse to start" ci-no-settings --rm \
            -e APP_ENV=prod sunrise-voice-agent:ci 2>&1) || code=$?
          echo "$output" | tail -n 15
          echo "exit code: $code"
          test "$code" = "1"
          for name in postgres_host postgres_db postgres_user postgres_password \
            app_db_user app_db_password audit_hmac_key turn_shared_secret turn_host \
            demo_access_token; do
            echo "$output" | grep -q "$name"
          done
      - name: Container whose runtime user is the owner must not start
        run: |
          . .github/ci-wait.sh
          # Every other setting is valid (the Compose env file), so only this rule can stop it.
          code=0
          output=$(bounded_run 60 "the app container to refuse to start" ci-same-user --rm \
            --env-file .env -e APP_DB_USER=sunrise sunrise-voice-agent:ci 2>&1) || code=$?
          echo "$output" | tail -n 5
          echo "exit code: $code"
          test "$code" = "1"
          echo "$output" | grep -q "1 validation error for StartupSettings"
          echo "$output" | grep -q "postgres_user must differ from app_db_user"
          if echo "$output" | grep -Eq "validation errors? for Settings"; then
            echo "the application settings were refused too; only the start-up rule should be"
            exit 1
          fi
      - name: Compose logs
        if: always()
        run: timeout 60 docker compose --env-file .env -f deploy/docker-compose.yml logs || true
