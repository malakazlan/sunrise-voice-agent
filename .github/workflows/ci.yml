name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run mypy --strict app tests scripts

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunrise
          POSTGRES_USER: sunrise
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sunrise -d sunrise"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sunrise
      POSTGRES_USER: sunrise
      POSTGRES_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.4"
      - run: uv sync --locked
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Without safe.directory, git refuses the mounted checkout (different owner). When git
      # cannot read the repo, gitleaks reports "0 commits scanned" and exits 0, so the step
      # also requires a non-zero commit count.
      # By default gitleaks runs `git log -p -U0 --full-history --all --diff-filter=tuxdb`, so it
      # would scan every fetched branch. --log-opts replaces everything after -U0: the same
      # options with HEAD scan only the commit under test and its ancestors (on pull_request
      # the merge ref, on push main).
      - name: Scan the history of the checked-out commit
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-banner --no-color \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          scanned=$(sed -n 's/.* \([0-9][0-9]*\) commits scanned\..*/\1/p' "$RUNNER_TEMP/gitleaks.log")
          echo "commits scanned: ${scanned:-none}"
          test "${scanned:-0}" -gt 0

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant decoy env files that must not reach the image
        run: |
          printf 'DECOY=1\n' > app/.env
          printf 'DECOY=1\n' > app/.env.local
      - run: docker build -t sunrise-voice-agent:ci .
      - name: No .env file in the image
        run: |
          found=$(docker run --rm --entrypoint find sunrise-voice-agent:ci /app -name '.env*')
          if [ -n "$found" ]; then
            echo ".env files found in the image:"
            echo "$found"
            exit 1
          fi
          echo "no .env files under /app"
      - name: Compose refuses to start without the database variables
        run: |
          code=0
          output=$(docker compose -f deploy/docker-compose.yml config 2>&1) || code=$?
          echo "$output" | tail -n 3
          echo "exit code: $code"
          test "$code" != "0"
          # Compose versions differ: some stop at the first missing variable, others list all.
          pattern="required variable (POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|APP_ENV) is missing a value"
          echo "$output" | grep -Eq "$pattern"
      - name: Write the Compose env file
        run: |
          printf '%s\n' APP_ENV=prod POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432 \
            POSTGRES_DB=sunrise POSTGRES_USER=sunrise \
            POSTGRES_PASSWORD=ci-compose-only-password-0001 \
            TURN_HOST=127.0.0.1 TURN_SHARED_SECRET=ci-compose-only-turn-secret-00000001 \
            DEMO_ACCESS_TOKEN=ci-compose-only-access-token-000000001 MAX_CONCURRENT_CALLS=3 \
            UNRELATED_DECOY=1 > .env
      - name: Smoke test through Compose
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
          status=000
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$status" = "200" ] && break
            sleep 1
          done
          echo "GET /health -> $status"
          test "$status" = "200"
          docs=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)
          echo "GET /docs -> $docs"
          test "$docs" = "404"
          uid=$(docker compose --env-file .env -f deploy/docker-compose.yml exec -T app id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
          app=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q app)
          health=none
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$app")
            [ "$health" = "healthy" ] && break
            sleep 1
          done
          echo "HEALTHCHECK -> $health"
          test "$health" = "healthy"
          patients=$(docker compose --env-file .env -f deploy/docker-compose.yml exec -T db \
            psql -U sunrise -d sunrise -tAc 'SELECT count(*) FROM patients')
          echo "patients: $patients"
          test "$patients" = "5"
      - name: The db container holds only the database variables
        run: |
          db=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q db)
          image=$(docker inspect --format '{{.Config.Image}}' "$db")
          # Allowed: what the Postgres image sets itself, plus the three credentials.
          {
            docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image"
            printf '%s\n' POSTGRES_DB= POSTGRES_USER= POSTGRES_PASSWORD=
          } | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/allowed-env"
          # Names only; values are never printed.
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$db" \
            | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/db-env"
          echo "db environment names: $(tr '\n' ' ' < "$RUNNER_TEMP/db-env")"
          unexpected=$(comm -23 "$RUNNER_TEMP/db-env" "$RUNNER_TEMP/allowed-env")
          if [ -n "$unexpected" ]; then
            echo "unexpected variables in the db container: $unexpected"
            exit 1
          fi
          for name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            grep -qx "$name" "$RUNNER_TEMP/db-env"
          done
          echo "db environment holds only the database variables"
      - name: The app container receives exactly the settings variables
        run: |
          # Compose's resolved configuration, read by the app's own Settings class inside the
          # image. Names only; values are never printed.
          docker compose --env-file .env -f deploy/docker-compose.yml config --format json \
            | docker run -i --rm --entrypoint python sunrise-voice-agent:ci -c '
          import json, sys
          from app.config import Settings
          received = set(json.load(sys.stdin)["services"]["app"]["environment"])
          fields = {name.upper() for name in Settings.model_fields}
          print("app environment names:", " ".join(sorted(received)))
          if received != fields:
              print("missing:", sorted(fields - received), "unexpected:", sorted(received - fields))
              sys.exit(1)
          '
      - name: The coturn container holds only its own variables
        run: |
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          image=$(docker inspect --format '{{.Config.Image}}' "$coturn")
          {
            docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image"
            printf '%s\n' TURN_HOST= TURN_SHARED_SECRET= MAX_CONCURRENT_CALLS=
          } | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/allowed-coturn-env"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$coturn" \
            | cut -d= -f1 | sed '/^$/d' | sort -u > "$RUNNER_TEMP/coturn-env"
          echo "coturn environment names: $(tr '\n' ' ' < "$RUNNER_TEMP/coturn-env")"
          unexpected=$(comm -23 "$RUNNER_TEMP/coturn-env" "$RUNNER_TEMP/allowed-coturn-env")
          if [ -n "$unexpected" ]; then
            echo "unexpected variables in the coturn container: $unexpected"
            exit 1
          fi
      - name: coturn runs from one config file, with quotas and deny rules, secret off its arguments
        run: |
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          state=$(docker inspect --format '{{.State.Status}} restarts={{.RestartCount}}' "$coturn")
          echo "coturn: $state"
          test "$state" = "running restarts=0"
          # The running process's arguments: one config file and nothing else, so neither a
          # second config source nor the secret.
          docker exec "$coturn" cat /proc/1/cmdline > "$RUNNER_TEMP/coturn-cmdline"
          args=$(tr '\0' ' ' < "$RUNNER_TEMP/coturn-cmdline")
          echo "coturn command line: $args"
          test "$args" = "turnserver -c /tmp/turnserver.conf "
          secret=$(sed -n 's/^TURN_SHARED_SECRET=//p' .env)
          test -n "$secret"
          if tr '\0' '\n' < "$RUNNER_TEMP/coturn-cmdline" | grep -qF "$secret"; then
            echo "the shared secret is in coturn's arguments"
            exit 1
          fi
          # The settings coturn started from, without the secret line, which is there once.
          test "$(docker exec "$coturn" grep -c '^static-auth-secret=' /tmp/turnserver.conf)" = 1
          docker exec "$coturn" grep -v -e '^static-auth-secret=' -e '^#' /tmp/turnserver.conf \
            > "$RUNNER_TEMP/coturn-settings"
          cat "$RUNNER_TEMP/coturn-settings"
          for line in realm=127.0.0.1 user-quota=4 total-quota=27 max-bps=64000 \
            bps-capacity=1728000 max-allocate-lifetime=120 use-auth-secret no-tls \
            no-tcp-relay no-multicast-peers min-port=49160 max-port=49359 log-file=/dev/null \
            denied-peer-ip=0.0.0.0-0.255.255.255 denied-peer-ip=10.0.0.0-10.255.255.255 \
            denied-peer-ip=100.64.0.0-100.127.255.255 denied-peer-ip=127.0.0.0-127.255.255.255 \
            denied-peer-ip=169.254.0.0-169.254.255.255 denied-peer-ip=172.16.0.0-172.31.255.255 \
            denied-peer-ip=192.168.0.0-192.168.255.255 denied-peer-ip=::1 \
            denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
            denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff; do
            grep -qxF "$line" "$RUNNER_TEMP/coturn-settings" || { echo "missing: $line"; exit 1; }
          done
          echo "coturn settings checked"
      - name: coturn's entrypoint accepts and refuses the same values as the app
        run: |
          # A stub turnserver shows what the entrypoint would start coturn with; the app side
          # of the same table (deploy/coturn/validation-cases.json) is a pytest test.
          coturn=$(docker compose --env-file .env -f deploy/docker-compose.yml ps -q coturn)
          image=$(docker inspect --format '{{.Config.Image}}' "$coturn")
          python3 scripts/check_coturn_entrypoint.py --image "$image"
      - name: Forced-relay echo through coturn, and the per-credential relay quota
        run: |
          # Only networking differs from the stack above: app and coturn join a network whose
          # addresses coturn does not deny, so no peer is allowed and every deny rule applies.
          echo "--- override used only by this step"
          cat deploy/docker-compose.relay-test.yml
          export TURN_HOST=203.0.113.10
          relay() { docker compose --env-file .env -f deploy/docker-compose.yml \
            -f deploy/docker-compose.relay-test.yml "$@"; }
          relay up -d --build
          status=000
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$status" = "200" ] && break
            sleep 1
          done
          test "$status" = "200"
          coturn=$(relay ps -q coturn)
          docker exec "$coturn" grep -v -e '^static-auth-secret=' -e '^#' /tmp/turnserver.conf \
            > "$RUNNER_TEMP/relay-settings"
          echo "--- coturn settings here against the committed run (only the realm may differ)"
          diff "$RUNNER_TEMP/coturn-settings" "$RUNNER_TEMP/relay-settings" || true
          diff <(grep -v '^realm=' "$RUNNER_TEMP/coturn-settings") \
            <(grep -v '^realm=' "$RUNNER_TEMP/relay-settings")
          token=$(sed -n 's/^DEMO_ACCESS_TOKEN=//p' .env)
          probe() { docker run --rm --network sunrise-voice-agent_relay-test \
            -e PROBE_TOKEN="$token" -v "$PWD/scripts:/probe:ro" --entrypoint python \
            sunrise-voice-agent:ci -I /probe/echo_probe.py --url http://app:8000 "$@"; }
          echo "--- three calls, relay candidates only"
          probe --calls 3 --relay
          echo "--- one credential tries twelve relays; another caller still gets one"
          probe --hoard 12 --expect-hoarded 4 --calls 1 --relay
      - name: Postgres logs no ERROR or WARNING lines, details or failing statements
        run: |
          show() {
            docker compose --env-file .env -f deploy/docker-compose.yml exec -T db \
              psql -U sunrise -d sunrise -tAc "SHOW $1"
          }
          messages=$(show log_min_messages)
          verbosity=$(show log_error_verbosity)
          statements=$(show log_min_error_statement)
          echo "log_min_messages=$messages log_error_verbosity=$verbosity" \
            "log_min_error_statement=$statements"
          test "$messages" = "log"
          test "$verbosity" = "terse"
          test "$statements" = "panic"
      - name: Container without APP_ENV must not start
        run: |
          code=0
          output=$(timeout 60 docker run --rm sunrise-voice-agent:ci 2>&1) || code=$?
          echo "$output" | tail -n 5
          echo "exit code: $code"
          test "$code" = "1"
          echo "$output" | grep -q "app_env"
      - name: Container without database or voice settings must not start
        run: |
          code=0
          output=$(timeout 60 docker run --rm -e APP_ENV=prod sunrise-voice-agent:ci 2>&1) || code=$?
          echo "$output" | tail -n 12
          echo "exit code: $code"
          test "$code" = "1"
          for name in postgres_host postgres_db postgres_user postgres_password \
            turn_shared_secret turn_host demo_access_token; do
            echo "$output" | grep -q "$name"
          done
      - name: Compose logs
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs || true
