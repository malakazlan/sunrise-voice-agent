<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice agent test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    label, button { display: block; margin: 0.75rem 0; }
    input[type="password"] { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; }
    dt { font-weight: bold; margin-top: 0.5rem; }
    ol#turns { padding-left: 1.2rem; }
    ol#turns li { margin: 0.75rem 0; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
    .given { color: #444; }
    .hidden { font-style: italic; color: #777; }
    .reply { font-weight: bold; margin: 0.3rem 0; }
    .timings { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #555; }
    .handoff { color: #a00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Voice agent test</h1>
  <p>Test page, synthetic data only. The agent speaks; what it says also appears here as text.
    Speak after the opening line. Timings start when you stopped speaking.</p>

  <label>Access token
    <input id="token" type="password" autocomplete="off">
  </label>
  <label><input id="relay" type="checkbox"> Relay only (force the call through TURN)</label>
  <button id="call" type="button">Call</button>
  <button id="hangup" type="button" disabled>Hang up</button>

  <dl>
    <dt>Connection state</dt><dd id="state">idle</dd>
    <dt>Candidate type in use</dt><dd id="candidate">none</dd>
    <dt>Why the call ended</dt><dd id="ended">-</dd>
  </dl>

  <audio id="voice" autoplay></audio>

  <h2>Turns</h2>
  <ol id="turns"></ol>

  <script>
    const el = (id) => document.getElementById(id);
    let pc = null;
    let mic = null;
    let statsTimer = null;

    const show = (id, text) => { el(id).textContent = text; };

    const authHeaders = () => {
      const token = el("token").value.trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    };

    const refusal = (response, what) => {
      if (response.status === 401) return `${what} refused: wrong or missing access token`;
      if (response.status === 503) return `${what} refused: too many calls, try again later`;
      return `${what} failed (HTTP ${response.status})`;
    };

    // The offer is sent once candidate gathering is complete (no trickle ICE).
    const gatheringComplete = (connection, limitMs) => new Promise((resolve) => {
      if (connection.iceGatheringState === "complete") return resolve();
      const timer = setTimeout(resolve, limitMs);
      connection.addEventListener("icegatheringstatechange", () => {
        if (connection.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
      });
    });

    const updateStats = async () => {
      if (!pc) return;
      const stats = await pc.getStats();
      let pair = null;
      stats.forEach((report) => {
        if (report.type === "transport" && report.selectedCandidatePairId) {
          pair = stats.get(report.selectedCandidatePairId);
        }
      });
      if (!pair) {
        // Firefox marks the pair in use instead of reporting it on the transport.
        stats.forEach((report) => {
          if (report.type === "candidate-pair" && report.selected) pair = report;
        });
      }
      if (pair) {
        const local = stats.get(pair.localCandidateId);
        const remote = stats.get(pair.remoteCandidateId);
        show("candidate", `this device: ${local?.candidateType ?? "?"}, server: ${remote?.candidateType ?? "?"}`);
      }
    };

    // Everything from the server is data: written with textContent, never as markup.
    const line = (className, text) => {
      const node = document.createElement("div");
      node.className = className;
      node.textContent = text;
      return node;
    };

    const ms = (value) => (typeof value === "number" ? `${value} ms` : "-");

    // Each turn's item, by turn number, for the time to its first audio, which comes later.
    const turnItems = new Map();

    const addNote = (text) => {
      const item = document.createElement("li");
      item.append(line("hidden", text));
      el("turns").append(item);
    };

    const addTurn = (message) => {
      const item = document.createElement("li");
      if (message.type === "opening") {
        item.append(line("given", "Opening line (said by the system)"));
      } else if (message.type === "said") {
        item.append(line("given", "Said by the system"));
      } else {
        const given = typeof message.shown === "string"
          ? line("given", `Given to the assistant: ${message.shown}`)
          : line("hidden", "(not shown to the assistant)");
        item.append(given);
      }
      const lines = Array.isArray(message.lines) ? message.lines : [];
      if (lines.length === 0) item.append(line("hidden", "(no reply)"));
      lines.forEach((text) => item.append(line("reply", String(text))));
      if (typeof message.withheld === "string") {
        item.append(line("hidden", `(a reply was withheld: ${message.withheld})`));
      }
      if (message.type === "turn") {
        const t = message.timings || {};
        item.append(line("timings",
          `silence wait ${ms(t.vad_ms)} | then transcript ${ms(t.stt_ms)}`
          + ` | then first token ${ms(t.first_token_ms)} | last token ${ms(t.last_token_ms)}`
          + ` | tool rounds ${t.tool_rounds ?? "-"} | turn done ${ms(t.total_ms)}`
          + " after you stopped speaking"));
        if (message.hand_off === true) item.append(line("handoff", "Hand-off requested"));
        turnItems.set(message.turn, item);
      }
      el("turns").append(item);
    };

    const showFirstAudio = (message) => {
      const item = turnItems.get(message.turn);
      if (item) item.append(line("timings", `first audio ${ms(message.first_audio_ms)} after you stopped speaking`));
    };

    const hangUp = () => {
      clearInterval(statsTimer);
      statsTimer = null;
      if (pc) pc.close();
      pc = null;
      if (mic) mic.getTracks().forEach((track) => track.stop());
      mic = null;
      el("voice").srcObject = null;
      turnItems.clear();
      el("call").disabled = false;
      el("hangup").disabled = true;
    };

    const call = async () => {
      el("call").disabled = true;
      el("hangup").disabled = false;
      show("candidate", "none");
      show("ended", "-");
      el("turns").replaceChildren();
      try {
        show("state", "fetching ICE servers");
        const ice = await fetch("/ice-servers", { headers: authHeaders() });
        if (!ice.ok) throw new Error(refusal(ice, "ICE servers"));
        const { iceServers } = await ice.json();

        show("state", "asking for the microphone");
        mic = await navigator.mediaDevices.getUserMedia({ audio: true });

        pc = new RTCPeerConnection({
          iceServers,
          iceTransportPolicy: el("relay").checked ? "relay" : "all",
        });
        pc.addTransceiver(mic.getAudioTracks()[0], { direction: "sendrecv" });
        // The agent's voice: the server's audio track, played as it arrives.
        pc.ontrack = (event) => {
          el("voice").srcObject = event.streams[0] ?? new MediaStream([event.track]);
        };
        // The server sends each turn's result on this channel, as JSON.
        const channel = pc.createDataChannel("messages");
        channel.onmessage = (event) => {
          let message;
          try { message = JSON.parse(event.data); } catch { return; }
          if (!message) return;
          if (["opening", "turn", "said"].includes(message.type)) addTurn(message);
          if (message.type === "first_audio") showFirstAudio(message);
          if (message.type === "interrupted") addNote("(you interrupted the agent)");
          if (message.type === "ended") {
            // The server's last message, kept on the page when the connection then drops.
            const ended = typeof message.hint === "string"
              ? `${message.reason}: ${message.hint}`
              : String(message.reason);
            show("ended", ended);
            addNote(`(the call ended: ${ended})`);
          }
        };
        pc.onconnectionstatechange = () => {
          if (!pc) return;
          show("state", pc.connectionState);
          if (pc.connectionState === "connected" && !statsTimer) {
            updateStats();
            statsTimer = setInterval(updateStats, 1000);
          }
          if (pc.connectionState === "failed" || pc.connectionState === "closed") hangUp();
        };

        await pc.setLocalDescription(await pc.createOffer());
        show("state", "gathering candidates");
        await gatheringComplete(pc, 5000);

        show("state", "sending offer");
        const response = await fetch("/offer", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
        });
        if (!response.ok) throw new Error(refusal(response, "Call"));
        const answer = await response.json();
        await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
      } catch (error) {
        hangUp();
        show("state", `error: ${error.message}`);
      }
    };

    el("call").addEventListener("click", call);
    el("hangup").addEventListener("click", () => { hangUp(); show("state", "hung up"); });
  </script>
</body>
</html>
