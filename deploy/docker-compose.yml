name: sunrise-voice-agent

# Run from the repo root: docker compose --env-file .env -f deploy/docker-compose.yml up --build
#
# Every value is interpolated from --env-file .env (or the shell), and each container receives
# only the variables it needs: db its three credentials (the owner); startup, a one-shot run of
# the start-up steps, every setting of the deployment, which its first step checks together
# (each secret strong, and the admin password like no other) before the others start; app the
# voice role's settings, which hold no part of the owner's identity and no admin sign-in;
# admin-api the admin role's (the database as the runtime role, the audit key, the clock, the
# calls' longest, the model and the most calls at once, the admin's sign-in and the console's
# origin); coturn its own; console, the admin console (console/), only the admin API's origin.
# Compose refuses to start without the owner's credentials or APP_ENV. The services check the
# rest themselves and stop when a value they need is missing; an empty value counts as unset,
# so the app's own defaults apply. CI checks each service's variables against app/config.py.
# A platform that adds its env file to every service gives each container every variable: app
# and admin-api then ignore the other role's secrets and log their names once (app/config.py),
# but the values are in the container's environment all the same. CI runs the stack that way
# too (docker-compose.every-variable.yml).
#
# APP_HOST_PORT (default 8000) is the host port the app is published on, for when 8000 is taken
# (a server's own dashboard, for one). It is Compose's alone, reaches no container and is not an
# application setting, so set it in the shell, not in .env, whose unknown keys the app refuses:
#   APP_HOST_PORT=8100 docker compose --env-file .env -f deploy/docker-compose.yml up --build
# ADMIN_API_HOST_PORT (default 8001) is the admin API's, in the same way.
x-database-credentials: &database-credentials
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set; pass --env-file .env}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set; pass --env-file .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; pass --env-file .env}
# Where the database is and the runtime role, for startup and app alike. Inside Compose the
# database is always db:5432.
x-runtime-database: &runtime-database
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  APP_DB_USER: ${APP_DB_USER:-}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
  APP_ENV: ${APP_ENV:?APP_ENV is not set; pass --env-file .env}
  LOG_LEVEL: ${LOG_LEVEL:-}
# What the app and the admin API both hold: the clock, the audit key, the calls' longest
# (the admin API's live calls follow it); and the model and the most calls at once, which the
# admin API's config page shows.
x-clock-and-audit: &clock-and-audit
  SIMULATED_NOW: ${SIMULATED_NOW:-}
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
  MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-}
  MAX_CONCURRENT_CALLS: ${MAX_CONCURRENT_CALLS:-}
  LLM_MODEL: ${LLM_MODEL:-}
# The calls' own: the identity key, TURN, the access token, the vendors.
x-voice-settings: &voice-settings
  IDENTITY_HASH_KEY: ${IDENTITY_HASH_KEY:-}
  TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
  TURN_HOST: ${TURN_HOST:-}
  CALL_ACCESS_TOKEN: ${CALL_ACCESS_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  TTS_MODEL: ${TTS_MODEL:-}
  VAD_STOP_SECONDS: ${VAD_STOP_SECONDS:-}
  IDLE_SECONDS: ${IDLE_SECONDS:-}
# The admin API's own: the admin's sign-in and the console's origin.
x-admin-settings: &admin-settings
  ADMIN_USER: ${ADMIN_USER:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-}
x-app-image: &app-image
  context: ..
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16
    # Keep statement errors out of the server log, since their text can quote a value:
    # log_min_messages=log drops ERROR and WARNING lines but keeps LOG, FATAL and PANIC (for
    # example failed logins); terse drops DETAIL, HINT, QUERY and CONTEXT from what is still
    # logged; panic stops the failing statement from being logged.
    command:
      - postgres
      - -c
      - log_min_messages=log
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    environment: *database-credentials
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  # The start-up steps, as the owner, once per start of the stack: check every setting of the
  # deployment together, migrate, set up the runtime role, seed. It exits when done; a failure in
  # any step ends it with a non-zero code, and then neither app nor admin-api starts.
  startup:
    build: *app-image
    command: ["sh", "-c", "python -m app.config && alembic upgrade head && python -m app.db.roles && python -m app.db.seed"]
    restart: "no"
    # The image's HEALTHCHECK asks the server, which this container never runs.
    healthcheck:
      disable: true
    # Exactly the start-up check's fields (STARTUP_CHECK_FIELDS in app/config.py): every
    # setting but the role, which the check sets.
    environment:
      <<: [*database-credentials, *runtime-database, *clock-and-audit, *voice-settings, *admin-settings]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: *app-image
    # Loopback only: on a server the app is reached through the HTTPS proxy, not this port.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    # Exactly the voice role's fields (VOICE_FIELDS in app/config.py): the runtime role, never
    # the owner, and not the admin's sign-in, which only the admin API holds.
    environment:
      <<: [*runtime-database, *clock-and-audit, *voice-settings]
      APP_ROLE: voice
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set; pass --env-file .env}
    depends_on:
      startup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # The admin API, from the same image, in a process of its own: no call route, no voice
  # pipeline, and no key of a vendor, TURN secret, access token or identity key, so it starts
  # without them. Without ADMIN_PASSWORD it still starts, answers /health, and serves nothing
  # under /admin. Loopback only, like the app: on a server it is reached through the HTTPS
  # proxy, on a host of its own beside the console's.
  admin-api:
    build: *app-image
    ports:
      - "127.0.0.1:${ADMIN_API_HOST_PORT:-8001}:8000"
    # Exactly the admin role's fields (ADMIN_FIELDS in app/config.py), and FORWARDED_ALLOW_IPS.
    environment:
      <<: [*runtime-database, *clock-and-audit, *admin-settings]
      APP_ROLE: admin
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set; pass --env-file .env}
      # No setting: uvicorn reads it itself. The addresses whose X-Forwarded-For and
      # X-Forwarded-Proto it trusts; behind the HTTPS proxy, the proxy's, so that the sign-in
      # limit counts each client's address and not the proxy's. Set it in the shell, like
      # APP_HOST_PORT, not in .env.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      startup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  coturn:
    # The pinned coturn image with an entrypoint that starts it from one configuration file
    # (deploy/coturn): fixed settings, then the realm, quotas and secret from the environment.
    build:
      context: coturn
    # Host networking, as the coturn image recommends: relayed addresses are the server's own
    # and relay-to-relay traffic stays on the host. Open 3478/udp, 3478/tcp and
    # 49160-49359/udp in the server firewall.
    network_mode: host
    restart: unless-stopped
    environment:
      TURN_HOST: ${TURN_HOST:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      MAX_CONCURRENT_CALLS: ${MAX_CONCURRENT_CALLS:-}

  # The admin console (console/): a Next.js app served at its own origin. It holds no secret and
  # talks only to the admin API, whose exact origin is its one setting; without a valid one it
  # answers 503 to everything. It depends on nothing and nothing depends on it. ADMIN_API_ORIGIN is
  # no application setting and CONSOLE_HOST_PORT (default 3000) is Compose's alone, like
  # APP_HOST_PORT: set both in the shell, not in .env, whose unknown keys the app refuses.
  console:
    build:
      context: ../console
    ports:
      - "127.0.0.1:${CONSOLE_HOST_PORT:-3000}:3000"
    environment:
      ADMIN_API_ORIGIN: ${ADMIN_API_ORIGIN:-}

volumes:
  db-data:
