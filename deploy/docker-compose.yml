name: sunrise-voice-agent

# Run from the repo root: docker compose --env-file .env -f deploy/docker-compose.yml up --build
#
# The three database credentials are interpolated from --env-file .env (or the shell) and
# Compose refuses to start without them. The db container receives only these three; the app
# receives the same three plus the rest of .env, so there is one set of database credentials.
x-database-credentials: &database-credentials
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set; pass --env-file .env}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set; pass --env-file .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; pass --env-file .env}

services:
  db:
    image: postgres:16
    # Keep statement errors out of the server log, since their text can quote a value:
    # log_min_messages=log drops ERROR and WARNING lines but keeps LOG, FATAL and PANIC (for
    # example failed logins); terse drops DETAIL, HINT, QUERY and CONTEXT from what is still
    # logged; panic stops the failing statement from being logged.
    command:
      - postgres
      - -c
      - log_min_messages=log
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    environment: *database-credentials
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    # Loopback only: on a server the app is reached through the HTTPS proxy, not this port.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *database-credentials
      # Inside Compose the app always reaches the database as db:5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  coturn:
    image: coturn/coturn:4.19.2@sha256:ccdbc51e6f072130b0fc9eebda21f8d026d0a25581746c52557e887818011a3f
    # Host networking, as the coturn image recommends: relayed addresses are the server's own
    # and relay-to-relay traffic stays on the host. Open 3478/udp, 3478/tcp and
    # 49160-49200/udp in the server firewall.
    network_mode: host
    restart: unless-stopped
    environment:
      TURN_HOST: ${TURN_HOST:?TURN_HOST is required}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
    # The image's entrypoint expands $VAR in each argument; $$ keeps Compose from doing it,
    # so the secret is read from the container environment.
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=$${TURN_SHARED_SECRET}
      - --realm=$${TURN_HOST}
      - --fingerprint
      # No TLS listeners; DTLS is off unless --dtls is given.
      - --no-tls
      - --no-tcp-relay
      - --no-multicast-peers
      # No relaying to private, loopback, link-local or shared address ranges.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # coturn logs every peer address; caller addresses are kept out of the logs.
      - --no-stdout-log
      - --simple-log
      - --log-file=/dev/null

volumes:
  db-data:
