name: sunrise-voice-agent

# Both services read the repo's .env. The postgres image takes POSTGRES_DB, POSTGRES_USER and
# POSTGRES_PASSWORD from it, and the app takes the same values, so there is one set of database
# credentials. Inside Compose the app always reaches the database as db:5432.
services:
  db:
    image: postgres:16
    env_file:
      - path: ../.env
        required: false
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
