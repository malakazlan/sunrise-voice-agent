# coturn settings that do not depend on the deployment. The entrypoint writes the one
# configuration coturn starts from: these lines, then the realm, the quotas and the secret.
listening-port=3478
# Room for total-quota at the largest MAX_CONCURRENT_CALLS: 9 * 20 = 180 relay ports.
min-port=49160
max-port=49359
# An allocation nobody refreshes is gone within two minutes. Live clients refresh before
# the lifetime runs out (aiortc at five sixths of it), so a call lasts as long as it needs.
max-allocate-lifetime=120
use-auth-secret
fingerprint
# No TLS listeners; DTLS is off unless dtls is given.
no-tls
no-tcp-relay
no-multicast-peers
# No relaying to unspecified, private, loopback, link-local (cloud metadata included) or
# shared address ranges. The IPv6 unspecified address is not listed: coturn 4.19.2 matches
# both its forms, :: and ::-::, against IPv4 peers too and then refuses every relayed call.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# coturn logs every peer address; caller addresses are kept out of the logs.
no-stdout-log
simple-log
log-file=/dev/null
